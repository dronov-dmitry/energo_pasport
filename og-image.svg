<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Декоративный градиент -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фоновый прямоугольник с градиентом -->
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Декоративные элементы - линии -->
  <g opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="630" stroke="#60a5fa" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#60a5fa" stroke-width="2"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#60a5fa" stroke-width="2"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#60a5fa" stroke-width="2"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#60a5fa" stroke-width="2"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- Иконка дома/здания -->
  <g transform="translate(150, 180)">
    <!-- Основа здания -->
    <rect x="0" y="80" width="120" height="140" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <!-- Крыша -->
    <polygon points="-10,80 60,20 130,80" fill="#334155" stroke="#3b82f6" stroke-width="3"/>
    <!-- Окна -->
    <rect x="20" y="110" width="25" height="30" fill="#60a5fa" opacity="0.8"/>
    <rect x="75" y="110" width="25" height="30" fill="#60a5fa" opacity="0.8"/>
    <rect x="20" y="160" width="25" height="30" fill="#60a5fa" opacity="0.8"/>
    <rect x="75" y="160" width="25" height="30" fill="#60a5fa" opacity="0.8"/>
    <!-- Дверь -->
    <rect x="45" y="180" width="30" height="40" fill="#475569"/>
    <!-- Тепловые волны -->
    <path d="M -30 60 Q -20 40 -30 20 Q -20 0 -30 -20" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M -45 60 Q -35 40 -45 20 Q -35 0 -45 -20" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M -60 60 Q -50 40 -60 20 Q -50 0 -60 -20" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.2"/>
  </g>

  <!-- Основной текст -->
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#f8fafc">
    Энергетический паспорт
  </text>
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#3b82f6">
    здания онлайн
  </text>

  <!-- Подзаголовок -->
  <text x="600" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">
    Бесплатный расчёт по СП 50.13330.2024
  </text>

  <!-- Дополнительная информация -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b">
    Теплозащита • ГСОП • R-фактор
  </text>

  <!-- Логотип/домен внизу -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569">
    dronov-dmitry.github.io/energo_pasport
  </text>

  <!-- Декоративная линия -->
  <rect x="350" y="520" width="500" height="3" fill="url(#grad2)" opacity="0.5"/>
</svg>
